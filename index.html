    </header>

    <main id="board-area">
      <div id="canvas-container"></div>
    </main>

    <footer id="bar">

      <div class="panel">
        <div class="modal-title">Merge</div>
        <div class="opts">
          <button class="btn size-btn" data-size="3"><span>3 × 3 Easy</span><small data-best="3"></small></button>

          <button class="btn size-btn" data-size="5"><span>5 × 5 Hard</span><small data-best="5"></small></button>
          <button class="btn size-btn" data-size="6"><span>6 × 6 Master</span><small data-best="6"></small></button>
          <button class="btn size-btn" data-size="7"><span>7 × 7 Expert</span><small data-best="7"></small></button>
          <!-- <div/> -->
          <button class="btn size-btn" data-size="7" onclick="window.location.href='https://u24.gov.ua/';"><span>#StandWithUkraine</span><small>🇺🇦</small></button>
        </div>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="panel">
        <div class="modal-title">Paused</div>
        <div class="opts">
          <button class="btn" data-action="resume">Resume</button>
          <button class="btn btn-secondary" data-action="restart">Restart level</button>
          <button class="btn btn-secondary" data-action="menu">Main menu</button>
        </div>
      </div>
    </div>

    <div id="win-overlay" class="overlay hidden">
      <div class="panel">
        <div class="modal-title">You win!</div>
        <div id="win-time" class="modal-stats">Time: 00:00</div>
        <div id="win-best" class="modal-best"></div>
        <div class="opts">
          <button class="btn" data-action="next">Next level</button>
          <button class="btn btn-secondary" data-action="restart">Restart level</button>
          <button class="btn btn-secondary" data-action="menu">Main menu</button>
        </div>
      </div>
    </div>

    <div id="lose-overlay" class="overlay hidden">
      <div class="panel">
        <div class="modal-title" style="color: #f38ba8;">No moves left</div>
        <p class="modal-stats">There are no tiles left to merge.</p>
        <div class="opts">
          <button class="btn" data-action="undo">Undo</button>
          <button class="btn btn-secondary" data-action="restart">Try again</button>
          <button class="btn btn-secondary" data-action="menu">Main menu</button>
        </div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

</body>

</html>
